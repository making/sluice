[package]
name = "sluice-wicket-console"
version = "0.0.1-SNAPSHOT"
edition = "2024"
publish = false

# What the consoles of sluice-wicket-runtime-wasi and sluice-wicket-runtime-firecracker (both
# their own workspaces) have alike, so it is one too.
[workspace]

[dependencies]
tokio = { version = "1", features = ["net", "sync", "time", "fs", "io-util", "rt"] }
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP Basic credentials
base64 = "0.22"
# the queries
form_urlencoded = "1"
# the digests files are kept under
sha2 = "0.10"
# the names of the uploads being received
getrandom = "0.4"
# the browsers' sign-in
sluice-wicket-oidc = { path = "../sluice-wicket-oidc" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
