[package]
name = "sluice-oidc"
version = "0.0.1-SNAPSHOT"
edition = "2024"
publish = false

# The OpenID Provider client of sluice-wicket-wasi's console and sluice-wicket-cf-api (both
# their own workspaces), so it is one too.
[workspace]

[dependencies]
# the provider, over TLS through the rustls below (no provider of reqwest's own)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# the roots a provider's certificate is verified against, without a CA of one's own
webpki-roots = "1"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PKCE, the HMAC of the sessions
sha2 = "0.10"
base64 = "0.22"
# the state, the nonce, the verifier, the keys
getrandom = "0.4"
form_urlencoded = "1"

[features]
# the mock provider of the tests
mock = []

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
