[package]
name = "sluice-wicket-runtime-firecracker"
version = "0.0.1-SNAPSHOT"
edition = "2024"
publish = false

# Its own workspace, as sluice-wicket-runtime-wasi; the guest (guest/) is another one (musl target)
[workspace]
exclude = ["guest"]

[dependencies]
# the tunnel client: node streams, flow control, the drain
sluice-wicket-tunnel = { path = "../sluice-wicket-tunnel" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process", "signal"] }
# the reloads' stop: the drain's token
tokio-util = "0.7"
# the Firecracker API: HTTP/1.1 over its Unix socket
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# --listen: the request head routing a connection
httparse = "1"
serde_json = "1"
# the --config file: YAML with ${NAME} interpolation from the environment
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize", "properties"] }
# random default client id, same policy as the Java client
uuid = { version = "1", features = ["v4"] }
# PR_SET_PDEATHSIG: a VM never outlives the wicket
libc = "0.2"
# the console: its gate, its page's shared files, its directory's layout
sluice-wicket-console = { path = "../sluice-wicket-console" }
http = "1"
# PUT /api/images: an image's rootfs, pulled from its registry, its layers unpacked
sluice-wicket-registry = { path = "../sluice-wicket-registry" }
reqwest = { version = "0.13", default-features = false }
tar = { version = "0.4", default-features = false }
flate2 = "1"
sha2 = "0.10"
# the names of the builds' directories
getrandom = "0.4"

[dev-dependencies]
# the tunnel's doubles: a tunnel server opening the tests' connections
sluice-wicket-tunnel = { path = "../sluice-wicket-tunnel", features = ["testing"] }
# the tests' clients over a tunnel connection: http/1.1 and h2c
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# paused time for the budget's waits
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
sluice-build-info = { path = "../sluice-build-info" }
