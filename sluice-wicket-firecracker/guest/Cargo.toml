[package]
name = "sluice-firecracker-guest"
version = "0.0.1-SNAPSHOT"
edition = "2024"
publish = false

# Its own workspace: the guest is built for x86_64-unknown-linux-musl (static, the VM's /init)
[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-vsock = "0.7"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
bytes = "1"
# PID 1 mounts /proc itself (the boot id)
libc = "0.2"
# launcher mode: /sluice/init.json
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "s"
