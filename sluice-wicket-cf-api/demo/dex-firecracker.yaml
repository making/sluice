# The Firecracker demo's OpenID Provider (record-firecracker.sh runs it with Docker): one user,
# demo@example.com with the password demo, and the cf-api as its client. dex.localhost is the
# loopback to the Mac, the container's alias to the wicket, which dials it for the cf-api's VM.
issuer: http://dex.localhost:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
staticClients:
  - id: cf
    name: sluice-wicket-cf-api
    secret: demo-secret
    redirectURIs: [http://cf.localhost:8080/uaa/callback]
enablePasswordDB: true
staticPasswords:
  - email: demo@example.com
    username: demo
    preferredUsername: demo
    userID: 1c2a0b3e-0000-4000-8000-000000000002
    hash: $2y$10$EAhSs4ahnjR2Rfjxkz9Y3uq2MyG87Rwswp2nfJ5wZ6JvrNl/h8C4i
