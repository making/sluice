[package]
name = "sluice-wicket-cf-api"
version = "0.0.1-SNAPSHOT"
edition = "2024"
publish = false

# Its own workspace, laid out as sluice-flume: built apart from sluice-wicket-runtime-wasi (no
# wasmtime in its tree: whether a component loads is the wicket's call).
[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-std", "io-util", "signal", "fs"] }
hyper = { version = "1", features = ["server", "http1"] }
# a stop's wait for the connections, the requests and the puts under way
tokio-util = { version = "0.7", features = ["rt"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
# the wickets' app API (plain HTTP: the cf-api sits next to its wickets); a droplet as a stream;
# the blobs' bucket (--blobs), its TLS on the provider installed (ring)
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
# a start's puts to the wickets, and their watches, at once
futures-util = "0.3"
# the OpenID Provider behind cf login --sso
sluice-wicket-oidc = { path = "../sluice-wicket-oidc" }
# its connections
sluice-wicket-server = { path = "../sluice-wicket-server" }
# the style of its pages (cf login --sso), the wickets' consoles'
sluice-wicket-console = { path = "../sluice-wicket-console" }
# the images cf push --docker-image names
sluice-wicket-registry = { path = "../sluice-wicket-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the manifests cf push applies
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
# the droplets' digests, and the HMAC of the tokens
sha2 = "0.10"
# the package cf push uploads
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# a static site's files, as the wicket takes them (and the layers of the image the test
# pushes for a Firecracker wicket)
tar = { version = "0.4", default-features = false }
# the guids
uuid = { version = "1", features = ["v4"] }
form_urlencoded = "1"
base64 = "0.22"
# the key the tokens are signed with
getrandom = "0.4"
# its own lines' feed to the sluice-flume, as a wicket's
sluice-wicket-tunnel = { path = "../sluice-wicket-tunnel" }
# the live access log the apps' logs come from: a watch of the sluice-flume
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
# its TLS (grpcs, --flume-insecure; its own listener with --tls-cert); the ring provider
# matches tonic's tls-ring
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# the state in PostgreSQL (--state): its TLS, as the bucket's, verified against the webPKI roots
# unless a CA is given
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.14"
webpki-roots = "1"

[dev-dependencies]
# the integration test's certificate of the cf-api's own TLS, its requests to it and its
# OpenID Provider, as a browser keeping the sign-in's cookie
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "cookies"] }
sluice-wicket-oidc = { path = "../sluice-wicket-oidc", features = ["mock"] }
# the flume two instances' logs go round
sluice-flume = { path = "../sluice-flume" }
# paused time for the bound on a quiet connection
tokio = { version = "1", features = ["test-util"] }
# the layers of the image the test pushes for a Firecracker wicket
flate2 = "1"
# the crypto provider a client built here needs installed first
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[build-dependencies]
tonic-prost-build = "0.14"
sluice-build-info = { path = "../sluice-build-info" }

[profile.release]
strip = true
