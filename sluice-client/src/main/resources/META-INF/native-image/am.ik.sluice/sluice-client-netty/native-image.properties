# Netty frees direct memory by closing a shared Arena when it has no Unsafe, as on a
# native image; without this the release fails and takes the gRPC connection down.
# Not under am.ik.sluice/<artifactId>: Spring AOT writes its native-image.properties there
Args = -H:+UnlockExperimentalVMOptions -H:+SharedArenaSupport -H:-UnlockExperimentalVMOptions
