management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.info.git.mode=full
management.info.java.enabled=true
management.info.os.enabled=true
# HTTP server for the actuator endpoints (health / info / prometheus)
server.port=9001
# upstream connections open at once over every server node; 0 (default) = derived so that the
# worst-case buffering of every connection fits in half the max heap (logged at startup)
# sluice.client.max-connections=0
spring.application.name=sluice-client
spring.config.import=optional:classpath:git.properties,optional:classpath:META-INF/build-info.properties
spring.main.keep-alive=true
spring.threads.virtual.enabled=true
