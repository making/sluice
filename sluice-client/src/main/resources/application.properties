management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.info.git.mode=full
management.info.java.enabled=true
management.info.os.enabled=true
# HTTP server for the actuator endpoints (health / info / prometheus)
server.port=9001
# how long dialing an upstream may wait: for the TCP connect, then for each read of the TLS
# handshake of an https upstream; the server's connection ends past it
# sluice.client.connect-timeout=10s
# how long a stopping client keeps relaying its open connections after it withdrew its routes
# from every server node; the ones left past it are closed. 0 = no drain, closed at once
# sluice.client.drain-grace=20s
# upstream connections open at once over every server node; 0 (default) = derived so that what
# every connection buffers outside the tunnel budget (293KiB), and the budget, fit in half the
# max heap (logged at startup)
# sluice.client.max-connections=0
# TCP keepalive idle time of every upstream connection: once it carried nothing for so long,
# the kernel probes the upstream every 10s and fails the connection after 3 probes
# unanswered; 0 = off
# sluice.client.tcp-keep-alive=60s
# bytes the connections may buffer beyond each connection's allowance, shared by all of them:
# the receive windows grown past the initial 64KiB (up to 1MiB each), and the frames a
# connection queues for the tunnel stream past one; 0 (default) = an eighth of half the max
# heap. Twice it (at least 1MiB) is the gRPC flow control window (logged at startup)
# sluice.client.tunnel-budget=0
# how long a tunnel stream may hold frames queued for the server while not ready, the server
# taking none of them, before the stream is cancelled (its connections failed, the slots they
# hold freed) and reconnected; 0 = off
# sluice.client.tunnel-stall-timeout=60s
spring.application.name=sluice-client
spring.config.import=optional:classpath:git.properties,optional:classpath:META-INF/build-info.properties
spring.main.keep-alive=true
spring.threads.virtual.enabled=true
