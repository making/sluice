syntax = "proto3";

package sluice.v1;

option java_multiple_files = true;
option java_package = "am.ik.sluice.v1.proto";

// Tunnel service carrying multiplexed virtual TCP connections over a single
// bidirectional stream (the gRPC counterpart of inlets' WebSocket tunnel).
service Tunnel {
  // Opens the control/data stream. The client authenticates with the
  // `authorization` metadata and identifies itself with `x-sluice-id`.
  rpc Connect (stream Frame) returns (stream Frame);
}

// Envelope for every message on the tunnel stream; exactly one body is set.
message Frame {
  oneof body {
    // Payload for the connection identified by `conn_id`.
    Data data = 1;
    // server -> client: dial request.
    Connect connect = 2;
    // Half-close of the sender -> receiver direction for `conn_id`.
    Close close = 3;
    // Abnormal termination of `conn_id`.
    Error error = 4;
    // client -> server: upstream announcement, sent once after connecting.
    Advertise advertise = 5;
    // Either direction: no-op liveness signal.
    KeepAlive keep_alive = 6;
    // server -> client: acknowledgment of the client's `Advertise`.
    AdvertiseAck advertise_ack = 7;
  }
}

message Data {
  int64 conn_id = 1;
  // Forwarded bytes.
  bytes payload = 2;
}

message Connect {
  int64 conn_id = 1;
  // Dial target ("host:port").
  string address = 2;
}

message Close {
  int64 conn_id = 1;
}

message Error {
  int64 conn_id = 1;
  // Human readable cause.
  string message = 2;
}

message Advertise {
  // Upstream services exposed by the client.
  repeated Upstream upstreams = 1;
}

message KeepAlive {
}

// Acknowledgment of the client's `Advertise`.
message AdvertiseAck {
  // Listen ports the server did not bind (e.g. outside the configured
  // tcp-port-range); empty means every advertised route was accepted.
  repeated uint32 rejected_ports = 1;
}

message Upstream {
  // Public domain the server routes requests for (empty means catch-all).
  string host = 1;
  // Upstream URL, e.g. http://127.0.0.1:3000.
  string target_url = 2;
  // When false the server rewrites the request Host/:authority to the target's
  // host[:port] before relaying; when true the head bytes pass through verbatim.
  bool preserve_host = 3;
  // TLS connections for this upstream are relayed untouched (routed by ClientHello
  // SNI, the upstream terminates TLS) instead of terminated on the data plane.
  bool tls_passthrough = 4;
  // Public port the server listens on to relay raw TCP connections for this upstream
  // verbatim (routed by listen port, no head parsing; 0 disables port routing).
  uint32 listen_port = 5;
}
