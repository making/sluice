syntax = "proto3";

package sluice.v1;

import "sluice/v1/build.proto";

option java_multiple_files = true;
option java_package = "am.ik.sluice.v1.proto";

// Tunnel service carrying multiplexed virtual TCP connections over a single
// bidirectional stream (the gRPC counterpart of inlets' WebSocket tunnel).
service Tunnel {
  // Opens the control/data stream. The client authenticates with the
  // `authorization` metadata and identifies itself with `x-sluice-id`.
  rpc Connect (stream Frame) returns (stream Frame);
  // Returns the cluster membership (authenticated like Connect). Single-node
  // servers return only themselves with an empty `public_url`.
  rpc ListNodes (ListNodesRequest) returns (ListNodesResponse);
  // Sets the gate state of a route (open / shut) on this node. Used by a peer
  // node to propagate a gate toggle made through its console (authenticated
  // like Connect).
  rpc SetRouteGate (SetRouteGateRequest) returns (SetRouteGateResponse);
}

message ListNodesRequest {
}

// Gate toggle of one route, propagated between nodes.
message SetRouteGateRequest {
  // Route key as shown in the console: the domain, the host pattern, `tcp:<port>`
  // for tcp routes, `*` for the catch-all.
  string key = 1;
  // true = open the gate, false = shut it.
  bool open = 2;
  // Node id of the node that took the toggle, for the receiver's logs.
  string origin = 3;
}

message SetRouteGateResponse {
}

// One cluster node.
message Node {
  string node_id = 1;
  // Control plane address clients connect to for this node; empty = keep using
  // the address the client reached the server at (bootstrap).
  string public_url = 2;
}

message ListNodesResponse {
  repeated Node nodes = 1;
  // Monotonically increasing; greater than a previously seen value means the
  // membership changed.
  uint64 membership_version = 2;
}

// Envelope for every message on the tunnel stream; exactly one body is set.
message Frame {
  oneof body {
    // Payload for the connection identified by `conn_id`.
    Data data = 1;
    // server -> client: dial request.
    Connect connect = 2;
    // Half-close of the sender -> receiver direction for `conn_id`.
    Close close = 3;
    // Abnormal termination of `conn_id`.
    Error error = 4;
    // client -> server: upstream announcement, sent after connecting, again
    // when listen ports were rejected, and once with `withdraw` set on shutdown.
    Advertise advertise = 5;
    // Either direction: no-op liveness signal.
    KeepAlive keep_alive = 6;
    // server -> client: acknowledgment of the client's `Advertise`.
    AdvertiseAck advertise_ack = 7;
    // server -> client: current cluster membership (nodes + version).
    MembershipUpdate membership_update = 8;
    // server -> client: this node is going away; move to the other nodes.
    Drain drain = 9;
    // Either direction: credit for more DATA payload on a windowed connection.
    WindowUpdate window_update = 10;
  }
}

message Data {
  int64 conn_id = 1;
  // Forwarded bytes.
  bytes payload = 2;
}

message Connect {
  int64 conn_id = 1;
  // Dial target ("host:port").
  string address = 2;
  // Server's initial receive window for this connection, in bytes; it may
  // grant more (WindowUpdate) and reclaim what was left unused. 0 (a server
  // without per-connection flow control, before 046cd21) is answered with an
  // Error for the connection.
  uint32 connection_window = 3;
  // The protocol the server speaks on this connection, by its ALPN id ("h2",
  // "http/1.1"); empty for bytes the server relays without interpreting them,
  // and from a server before this field. A client dialing a TLS upstream
  // negotiates it over ALPN.
  string application_protocol = 4;
}

message Close {
  int64 conn_id = 1;
}

message Error {
  int64 conn_id = 1;
  // Human readable cause.
  string message = 2;
}

message Advertise {
  // Upstream services exposed by the client. Every advertise on a stream
  // replaces the client's routes on the node (sluice-wicket-wasi re-advertises
  // on a route reload); one without upstreams removes them.
  repeated Upstream upstreams = 1;
  // Client's initial receive window per connection, in bytes; it may grant
  // more (WindowUpdate) and reclaim what was left unused. 0 (a client without
  // per-connection flow control: sluice-client before 046cd21, sluice-wicket-wasi
  // before f76388d) fails the tunnel stream with FAILED_PRECONDITION.
  uint32 connection_window = 2;
  // Build of the client; unset by clients that predate the field.
  PeerBuild build = 3;
  // The client is shutting down: the server removes every route of the client
  // and routes it no new connection, keeps relaying the ones open, and answers
  // with an AdvertiseAck carrying `withdrawn` once none is left: no Connect
  // follows that ack on the stream. Advertises after this one register nothing.
  // `upstreams` is ignored; the client repeats its routes there, so a server
  // predating the field registers them unchanged and acknowledges the advertise
  // without `withdrawn`.
  bool withdraw = 4;
}

// Either direction: the sender consumed `increment` more payload bytes of
// `conn_id`, or grants that many beyond them; the receiver may send that many
// more. A peer sending DATA beyond the window it was granted fails that
// connection with an Error ("flow control window exceeded"); the stream stays
// up. A peer predating `reclaim_above`, `released` and `blocked` ignores
// them.
message WindowUpdate {
  int64 conn_id = 1;
  uint32 increment = 2;
  // Non-zero: the sender of this update asks the receiver to give back the
  // credit it holds for `conn_id` beyond this many bytes (the receiver of the
  // DATA reclaims a window its peer leaves unused). 0 = no request.
  uint32 reclaim_above = 3;
  // Non-zero: the sender of this update gave up this much of the credit it
  // held for `conn_id`, answering a `reclaim_above`; it never sends those
  // bytes. 0 = none.
  uint32 released = 4;
  // True: the sender of this update has DATA for `conn_id` and no credit left
  // to send it; sent once each time it starts waiting for credit. The receiver
  // may take it as its window being the bound and grant more.
  bool blocked = 5;
}

message KeepAlive {
}

// Server -> client: the full cluster membership, sent on connect and whenever it changes.
message MembershipUpdate {
  repeated Node nodes = 1;
  uint64 membership_version = 2;
}

// Server -> client: the sending node is draining (stopping); the client should
// fail over to the other nodes and only come back once the node is listed again.
message Drain {
  // Human readable cause.
  string reason = 1;
}

// Acknowledgment of the client's `Advertise`.
message AdvertiseAck {
  // Listen ports the server did not bind (e.g. outside the configured
  // tcp-port-range); empty means every advertised route was accepted.
  repeated uint32 rejected_ports = 1;
  // Node id of the server that sent this ack; lets a client that reached the
  // same node through several addresses keep a single stream per node.
  string node_id = 2;
  // Build of the server that sent this ack; unset by servers that predate the field.
  PeerBuild build = 3;
  // The answer to an Advertise with `withdraw`: the client's routes are removed
  // and no connection is open or will be opened on the stream. Every ack the
  // server sends after it carries it too.
  bool withdrawn = 4;
}

message Upstream {
  // Public domain the server routes requests for (empty means catch-all).
  string host = 1;
  // Optional regular expression the request host (without its port) is matched
  // against; the match is against the whole name. When non-empty it takes
  // precedence over `host`.
  string host_pattern = 2;
  // Upstream URL, e.g. http://127.0.0.1:3000.
  string target_url = 3;
  // When true the server rewrites the request Host/:authority to the target's
  // host[:port] before relaying; when false the head bytes pass through verbatim.
  bool rewrite_host = 4;
  // TLS connections for this upstream are relayed untouched (routed by ClientHello
  // SNI, the upstream terminates TLS) instead of terminated on the data plane.
  bool tls_passthrough = 5;
  // Public port the server listens on to relay raw TCP connections for this upstream
  // verbatim (routed by listen port, no head parsing; 0 disables port routing). An
  // upstream with a listen port is reached only through it: `host` is then not used
  // for Host / SNI routing on the data port.
  uint32 listen_port = 6;
  // IP networks (CIDR or bare address) allowed to connect to this upstream on
  // the data plane; empty = the server-wide allow list applies. Literal
  // addresses only.
  repeated string allowed_cidrs = 7;
  // When true the upstream speaks HTTP/1.1 only: the data plane's TLS
  // termination prefers http/1.1 in ALPN for it, and an h2 stream for it is
  // answered 421 Misdirected Request; tls-passthrough routes are unaffected.
  bool force_http1 = 8;
  // How long, in milliseconds, a connection of this upstream relayed verbatim (TLS
  // passthrough, a tcp route, a hostless connection, an upgraded HTTP/1.1
  // connection) may relay no byte in either direction before the server closes it;
  // 0 = the server's default applies.
  uint64 verbatim_idle_timeout_millis = 9;
}
