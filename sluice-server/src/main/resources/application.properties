# liveness / readiness probe endpoints (readiness is gated by the cluster warmup and drain)
management.endpoint.health.probes.enabled=true
# health component details (clients / draining) appear in the body
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.info.git.mode=full
management.info.java.enabled=true
management.info.os.enabled=true
# the security filter chain observations flood the metrics with per-request spring.security.* meters
management.observations.enable.spring.security=false
# console HTML fragments / actuator payloads; static assets ship pre-compressed (.br / .gz)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,application/javascript,application/json
server.compression.min-response-size=1024
# h2c on the servlet connector: lets this app double as an h2c upstream in manual checks
server.http2.enabled=true
server.port=8081
# data plane IP access control: deny is evaluated first (blacklist), then allow
# (empty = allow every address); a route's allowed-cidrs replaces the allow list.
# Literal IPv4/IPv6 CIDRs or bare addresses, comma separated.
# sluice.access-control.allow-cidrs=10.0.0.0/8,2001:db8::/32
# sluice.access-control.deny-cidrs=203.0.113.0/24
# peers trusted as proxying load balancers: when the connection peer matches, the
# rightmost X-Forwarded-For entry (the one the proxy appended) is judged instead of the
# peer address; the LB must append to the header, client-sent entries stay in the chain
# sluice.access-control.trusted-proxy-cidrs=10.0.0.0/8
# client certificate issuance from the console: an SSL bundle whose keystore holds the CA
# private key + certificate (PEM); the console signs client certificates for the mTLS
# control plane, absent = the issuance panel is read-only
# sluice.ca-bundle=sluice-ca
# spring.ssl.bundle.pem.sluice-ca.keystore.private-key=file:ca-key.pem
# spring.ssl.bundle.pem.sluice-ca.keystore.certificate=ca.pem
# console auth: simple form login by default; switch to oidc and configure a client via
# spring.security.oauth2.client.registration.<id>.* to delegate sign-in to an IdP
sluice.console.auth.type=simple
# data plane connection limits, shared by the data port and every tcp route port.
# how long a tunnel stream may go without the client's first Advertise before it is failed
# (DEADLINE_EXCEEDED); until then it serves nothing and the client id's live session stays
# sluice.limits.advertise-timeout=10s
# Bytes the h2 demux relays may queue beyond each connection's own allowance (both ways),
# shared by all of them; 0 (default) = an eighth of half the max heap
# sluice.limits.h2-queue-budget=0
# how long an h2 stream may wait for a place within its upstream's
# SETTINGS_MAX_CONCURRENT_STREAMS before it is refused (REFUSED_STREAM, never seen by the
# upstream); 0 = off
# sluice.limits.h2-stream-wait-timeout=30s
# HTTP/1.1 whose client ended its side while a response is owed and none of it is relayed:
# after this long quiet the relay writes a "100 Continue", whose failure tells that the
# client is gone; at most four per response, never to HTTP/1.0; h2 whose client ended its
# side while responses are owed: a PING after each such quiet; 0 = off
# sluice.limits.half-close-probe-interval=1s
# one deadline for the PROXY header, TLS handshake and request head together; it also
# bounds a later HTTP/1.1 request head left incomplete between requests
# sluice.limits.head-timeout=10s
# how long a plaintext or TLS-terminated HTTP connection may idle between requests
# (HTTP/1.1: every response relayed, no next request begun; h2: no stream open) before it
# is closed (h2: with a GOAWAY NO_ERROR)
# sluice.limits.idle-timeout=60s
# connections open at once (an h2 connection counts once, whatever routes it reaches);
# 0 (default) = derived so that the worst-case buffering of every connection and
# the h2 queue budget fit in half the max heap (the effective value is logged at startup)
# sluice.limits.max-connections=0
# connections open at once from one source address (the PROXY protocol source with
# proxy-protocol=true, else the socket peer); 0 (default) = no limit beyond max-connections
# sluice.limits.max-connections-per-address=0
# the bytes moved to or from the client that count as progress against stall-timeout;
# less within it is a stall (1B = every byte counts)
# sluice.limits.stall-min-bytes=16KB
# how long a request or response in flight on a plaintext or TLS-terminated HTTP
# connection may wait on its client (not reading, not granting h2 window, not sending a
# request body due) without progress before it is closed (h2: with a GOAWAY
# ENHANCE_YOUR_CALM); waiting for an upstream does not count
# sluice.limits.stall-timeout=60s
# how long a tunnel stream may hold frames queued for its client while not ready, the client
# taking none of them (it stopped reading but keeps the connection alive), before the session
# is failed: its stream reset, its routes removed, the slots its connections hold freed;
# 0 = off
# sluice.limits.tunnel-stall-timeout=60s
# how long a connection relayed verbatim (TLS passthrough, tcp route, hostless, upgraded
# HTTP/1.1) may relay no byte in either direction before it is closed, for the routes whose
# upstream sets no verbatim-idle-timeout of its own; 0 (default) = off
# sluice.limits.verbatim-idle-timeout=0
# PROXY protocol (v1 / v2) on the data plane: the header is consumed before routing /
# relay and its source address becomes the connection peer (access control, access log);
# headerless connections are unaffected, a malformed one fails the connection
# sluice.proxy-protocol=true
spring.application.name=sluice-server
# gRPC is authenticated by the tunnel token, not an OAuth2 resource server. Its method-level
# @ConditionalOnBean(OpaqueTokenIntrospector) triggers a startup WARN without that jar.
spring.autoconfigure.exclude=org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerOAuth2ResourceServerAutoConfiguration
spring.config.import=optional:classpath:git.properties,optional:classpath:META-INF/build-info.properties
# gRPC keepalive: the client pings every 30s, so the permit must stay below that.
# Server-side pings detect dead clients and release their sessions/routes.
spring.grpc.server.keepalive.permit.time=10s
spring.grpc.server.keepalive.permit.without-calls=true
spring.grpc.server.keepalive.time=30s
spring.grpc.server.keepalive.timeout=10s
spring.grpc.server.port=8001
# Control plane (gRPC) TLS via an SSL bundle: lets a front end route per node by SNI
# without terminating TLS; clients connect with grpcs:// (self-signed: sluice.insecure).
# For mutual TLS add client-auth plus a truststore with the CA of the client certificates;
# clients present their own certificate via sluice.tls-bundle.
# spring.grpc.server.ssl.bundle=grpc-control
# spring.grpc.server.ssl.client-auth=REQUIRE
# spring.ssl.bundle.pem.grpc-control.keystore.private-key=file:grpc-key.pem
# spring.ssl.bundle.pem.grpc-control.keystore.certificate=cert.pem
# spring.ssl.bundle.pem.grpc-control.truststore.certificate=ca.pem
spring.mustache.servlet.expose-request-attributes=true
spring.mustache.servlet.expose-session-attributes=true
# login credentials for the console (simple auth); {noop} / {bcrypt} prefixes supported
spring.security.user.name=admin
spring.security.user.password={noop}admin
spring.threads.virtual.enabled=true
# console assets: content-hashed URLs ({{#src}} in the templates) cached for a year,
# served from the pre-compressed .br / .gz siblings when the client accepts them
spring.web.resources.cache.period=365d
spring.web.resources.cache.use-last-modified=false
spring.web.resources.chain.compressed=true
spring.web.resources.chain.strategy.content.enabled=true
