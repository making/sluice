# Netty frees direct memory by closing a shared Arena when it has no Unsafe, as on a
# native image; without this the release fails and takes the gRPC connection down.
# TypeParameterMatcher at run time: its initializer makes an instance of its own subclass,
# a cycle GraalVM 25.0's class-initializer simulation judges by its threads' order when a
# reachability metadata condition names the class (oracle/graal#14803; Netty 4.2.19 falls
# back to Netty 5's metadata, which does), failing the build now and then. Named here, the
# simulation leaves it alone.
# Not under am.ik.sluice/<artifactId>: Spring AOT writes its native-image.properties there
Args = -H:+UnlockExperimentalVMOptions -H:+SharedArenaSupport -H:-UnlockExperimentalVMOptions \
  --initialize-at-run-time=io.netty.util.internal.TypeParameterMatcher
