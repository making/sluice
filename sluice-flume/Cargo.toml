[package]
name = "sluice-flume"
version = "0.0.1-SNAPSHOT"
edition = "2024"
publish = false

# Its own workspace: built apart from sluice-wicket-wasi (no wasmtime in its tree).
[workspace]

[dependencies]
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-health = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-std", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }

[build-dependencies]
tonic-prost-build = "0.14"
sluice-build-info = { path = "../sluice-build-info" }

[profile.release]
strip = true
