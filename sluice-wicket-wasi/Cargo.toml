[package]
name = "sluice-wicket-wasi"
version = "0.0.1-SNAPSHOT"
edition = "2024"
publish = false
# examples/ holds the guest components, not Cargo examples of this crate
autoexamples = false

# Its own workspace: built apart from sluice-flume (wasmtime in its tree). The guest
# examples are another one (nightly toolchain, wasm32-wasip3).
[workspace]
exclude = ["examples"]

[dependencies]
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
http = "1"
tokio-stream = "0.1"
# rt: the TaskTracker the drain waits on
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
# random default client id, same policy as the Java client
uuid = { version = "1", features = ["v4"] }
# the key of the env digests (the version uuid takes)
getrandom = "0.4"
# wasi 0.3 (p3) host support only; p2 guests are unsupported
wasmtime = "50"
wasmtime-wasi = { version = "50", default-features = false, features = ["p3"] }
wasmtime-wasi-http = { version = "50", default-features = false, features = ["default-send-request", "p3"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body = "1"
http-body-util = "0.1"
bytes = "1"
# component fetch from http(s) locators
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# control-plane TLS (grpcs / --insecure); the ring provider matches tonic's tls-ring
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# wasmtime's ResourceLimiterAsync is #[async_trait]; the impl must match
async-trait = "0.1"
# the --config file: YAML with ${NAME} interpolation from the environment
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize", "properties"] }
# component digests: a reload keeps the handler of an unchanged component
sha2 = "0.10"
# the console: its JSON API, the query of an upload, HTTP Basic credentials
serde_json = "1"
form_urlencoded = "1"
base64 = "0.22"
# the console: a keyvalue namespace in a path (it may hold '/')
percent-encoding = "2"
# the sqlite keyvalue store; bundled: no system libsqlite3 (the build compiles C for ring already)
rusqlite = { version = "0.40", features = ["bundled"] }
# the redis keyvalue store: a multiplexed connection, reconnected; rediss:// on the ring
# rustls (the webPKI roots, or the store's ca-cert)
redis = { version = "1.7", optional = true, default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }

[features]
default = ["redis"]
# the redis keyvalue store
redis = ["dep:redis"]

[dev-dependencies]
# paused time for the stall watchdog tests
tokio = { version = "1", features = ["test-util"] }
# an h2 client for the per-connection stream limit; the version hyper uses
h2 = "0.4"
# the CA and certificate of the redis-server the rediss:// test runs
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[build-dependencies]
tonic-prost-build = "0.14"
sluice-build-info = { path = "../sluice-build-info" }

[profile.release]
strip = true
