name: Deploy wicket
# Builds and saves the sluice-wicket-wasi image once the Rust workflow succeeds on a push
# to main with its sluice-wicket-wasi job run (a flume-only run deploys nothing here). This
# file only takes effect from the default branch (workflow_run).
on:
  workflow_run:
    workflows:
    - Rust
    types:
    - completed
    branches:
    - main
# One deploy at a time, never cancelled midway (it may be pushing the images branch);
# GitHub keeps one pending run per group and cancels the older pending one.
concurrency:
  group: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && 'deploy-wicket' || format('deploy-wicket-noop-{0}', github.run_id) }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
jobs:
  target:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      revision: ${{ steps.target.outputs.revision }}
    steps:
    # Target: the commit of the triggering run, when its sluice-wicket-wasi job ran and
    # passed.
    # Skipped when the images branch already holds it or a newer commit.
    - name: Pick the revision to deploy
      id: target
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        TARGET: ${{ github.event.workflow_run.head_sha }}
      run: |
        WICKET=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --jq '.jobs[] | select(.name == "sluice-wicket-wasi") | .conclusion')
        if [ "${WICKET}" != "success" ]; then
          echo "Skipped: the sluice-wicket-wasi job of run ${RUN_ID} did not run (${WICKET:-absent})" | tee -a "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        # absent before the first deploy
        DEPLOYED=$(gh api "repos/${GITHUB_REPOSITORY}/contents/sluice-wicket-wasi.yaml?ref=images" --jq .content 2>/dev/null | base64 -d | awk '/^git_revision:/{print $2}' || true)
        STATUS=none
        if [ -n "${DEPLOYED}" ]; then
          STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${DEPLOYED}...${TARGET}" --jq .status)
        fi
        echo "target: ${TARGET}, deployed: ${DEPLOYED:-none}, target vs deployed: ${STATUS}" | tee -a "${GITHUB_STEP_SUMMARY}"
        case "${STATUS}" in
          identical|behind) echo "Skipped: ${TARGET} is not newer than the deployed revision" | tee -a "${GITHUB_STEP_SUMMARY}" ;;
          *) echo "revision=${TARGET}" >> "${GITHUB_OUTPUT}" ;;
        esac
  # The example guests (sluice-wicket-wasi/examples) as wasm OCI artifacts, as wkg oci push
  # makes them (a config of application/vnd.wasm.config.v0+json, the component one layer of
  # application/wasm): <registry>/<repository>/sluice-wicket-wasi/examples/<example>, the
  # revision and latest, what cf push --docker-image pulls. Apart from the image: its failure
  # deploys the wicket all the same.
  push-guests:
    needs: target
    if: needs.target.outputs.revision != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: sluice-wicket-wasi/examples
    env:
      REVISION: ${{ needs.target.outputs.revision }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.target.outputs.revision }}
    # the nightly examples/rust-toolchain.toml pins, with wasm32-wasip3
    - name: Build the guests
      run: |
        rustup toolchain install
        cargo build --release --locked
    - name: Install wkg
      run: |
        curl -sSfL -o "${RUNNER_TEMP}/wkg" https://github.com/bytecodealliance/wasm-pkg-tools/releases/download/v0.16.1/wkg-x86_64-unknown-linux-gnu
        echo "235ecf455e11b8b146e00f24f24c95b573cfe6a432f332358463b229311cec57  ${RUNNER_TEMP}/wkg" | sha256sum -c -
        sudo install -m 0755 "${RUNNER_TEMP}/wkg" /usr/local/bin/wkg
    - name: Push the guests
      env:
        WKG_OCI_USERNAME: ${{ github.actor }}
        WKG_OCI_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for WASM in target/wasm32-wasip3/release/*.wasm; do
          GUEST=$(basename "${WASM}" .wasm)
          REPOSITORY=$(echo "${GITHUB_REPOSITORY}/sluice-wicket-wasi/examples/${GUEST}" | tr '[:upper:]' '[:lower:]')
          wkg oci push \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${REVISION}" \
            --annotation "org.opencontainers.image.description=The ${GUEST} example guest of sluice-wicket-wasi, a wasi:http 0.3 component" \
            "${REGISTRY}/${REPOSITORY}:${REVISION}" "${WASM}"
          # latest: the revision's manifest under a second tag (a second push would make
          # another one, its config holding the push time)
          TOKEN=$(curl -sSf -u "${WKG_OCI_USERNAME}:${WKG_OCI_PASSWORD}" "https://${REGISTRY}/token?service=${REGISTRY}&scope=repository:${REPOSITORY}:pull,push" | jq -r .token)
          curl -sSf -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            -o "${RUNNER_TEMP}/manifest.json" "https://${REGISTRY}/v2/${REPOSITORY}/manifests/${REVISION}"
          curl -sSf -X PUT -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/vnd.oci.image.manifest.v1+json" \
            --data-binary "@${RUNNER_TEMP}/manifest.json" "https://${REGISTRY}/v2/${REPOSITORY}/manifests/latest"
          echo "pushed ${REGISTRY}/${REPOSITORY}:${REVISION} and :latest" | tee -a "${GITHUB_STEP_SUMMARY}"
        done
  # a Dockerfile build (a Rust binary), not a buildpack one
  build-image:
    needs: target
    if: needs.target.outputs.revision != ''
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
        - { arch: amd64,   runs_on: ubuntu-latest }
        - { arch: aarch64, runs_on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs_on }}
    env:
      REVISION: ${{ needs.target.outputs.revision }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.target.outputs.revision }}
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push image (${{ matrix.arch }})
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        IMAGE="${REGISTRY}/$(echo ${GITHUB_REPOSITORY}/sluice-wicket-wasi | tr '[:upper:]' '[:lower:]')"
        docker build -f sluice-wicket-wasi/Dockerfile --build-arg GIT_COMMIT=${REVISION} -t ${IMAGE}:${ARCH}_${REVISION} .
        docker push ${IMAGE}:${ARCH}_${REVISION}
        docker tag ${IMAGE}:${ARCH}_${REVISION} ${IMAGE}:${ARCH}
        docker push ${IMAGE}:${ARCH}
  push-manifest:
    needs:
    - target
    - build-image
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      REVISION: ${{ needs.target.outputs.revision }}
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Create and push manifest
      run: |
        IMAGE="${REGISTRY}/$(echo ${GITHUB_REPOSITORY}/sluice-wicket-wasi | tr '[:upper:]' '[:lower:]')"
        docker manifest create ${IMAGE}:${REVISION} \
          --amend ${IMAGE}:amd64_${REVISION} \
          --amend ${IMAGE}:aarch64_${REVISION}
        docker manifest push ${IMAGE}:${REVISION}
        docker manifest create ${IMAGE}:latest \
          --amend ${IMAGE}:amd64_${REVISION} \
          --amend ${IMAGE}:aarch64_${REVISION}
        docker manifest push ${IMAGE}:latest
    - name: Generate image file
      run: |
        IMAGE="${REGISTRY}/$(echo ${GITHUB_REPOSITORY}/sluice-wicket-wasi | tr '[:upper:]' '[:lower:]')"
        DIGEST=$(docker buildx imagetools inspect ${IMAGE}:${REVISION} | awk '/^Digest:/{print $2}')
        cat <<EOF > sluice-wicket-wasi.yaml
        image: ${IMAGE}@${DIGEST}
        git_revision: ${REVISION}
        deployment:
          image:
            repository: ${IMAGE}
            digest: ${DIGEST}
          podLabels:
            github.com/revision: ${REVISION}
        EOF
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sluice-wicket-wasi
        path: sluice-wicket-wasi.yaml
  save-image:
    needs:
    - target
    - push-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      REVISION: ${{ needs.target.outputs.revision }}
    steps:
    - name: Checkout images branch
      uses: actions/checkout@v4
      with:
        ref: images
    - name: Download image file
      uses: actions/download-artifact@v4
      with:
        name: sluice-wicket-wasi
    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add sluice-wicket-wasi.yaml
        git diff --cached --quiet || git commit -m ":robot: Update sluice-wicket-wasi.yaml for ${REVISION}"
        git pull --rebase origin images
        git push origin images
