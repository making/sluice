name: CI
on:
  push:
    branches:
    - main
    paths: &maven-paths
    - 'pom.xml'
    - 'mvnw'
    - '.mvn/**'
    - 'sluice-proto/**'
    - 'sluice-server/**'
    - 'sluice-client/**'
    - 'sluice-example-upstream/**'
    - 'sluice-it/**'
    - 'sluice-flume/**'
    - 'sluice-build-info/**'
    - '.github/workflows/ci.yaml'
    - '.github/workflows/deploy.yaml'
  pull_request:
    branches:
    - main
    paths: *maven-paths
# Every push to main gets its own run, so test feedback never waits behind another push
# (images are built by deploy.yaml once a run here succeeds). Pull request runs cancel
# in progress per PR.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: graalvm
        cache: 'maven'
    # the browsers ConsoleE2ETest drives; the Playwright version is in pom.xml
    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}
    # sluice-it builds sluice-flume (cargo, preinstalled on the runner) for its live
    # access log tests; prost needs protoc
    - name: Install protoc
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-flume/target
        key: cargo-test-${{ runner.os }}-${{ hashFiles('sluice-flume/Cargo.lock') }}
    - name: Test
      run: ./mvnw -V -B --no-transfer-progress verify
