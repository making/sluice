name: Rust
# The Rust crates' own gates, apart from CI: a Java-only change runs none of them, and
# each crate's job runs only when its paths changed. CI still builds sluice-flume for the
# sluice-it tests. A run with the sluice-flume / sluice-wicket-wasi / sluice-wicket-cf-api
# job passed deploys its image (deploy-flume.yaml / deploy-wicket.yaml / deploy-cf-api.yaml).
on:
  push:
    branches:
    - main
    paths: &rust-paths
    - 'sluice-flume/**'
    - 'sluice-wicket-wasi/**'
    - 'sluice-wicket-cf-api/**'
    - 'sluice-build-info/**'
    - 'sluice-oidc/**'
    - 'sluice-proto/src/main/proto/**'
    - '.github/workflows/rust.yaml'
    - '.github/workflows/deploy-flume.yaml'
    - '.github/workflows/deploy-wicket.yaml'
    - '.github/workflows/deploy-cf-api.yaml'
  pull_request:
    branches:
    - main
    paths: *rust-paths
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build-info: ${{ steps.filter.outputs.build-info }}
      oidc: ${{ steps.filter.outputs.oidc }}
      flume: ${{ steps.filter.outputs.flume }}
      wicket: ${{ steps.filter.outputs.wicket }}
      cf-api: ${{ steps.filter.outputs.cf-api }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          build-info:
          - 'sluice-build-info/**'
          - '.github/workflows/rust.yaml'
          oidc:
          - 'sluice-oidc/**'
          - '.github/workflows/rust.yaml'
          flume:
          - 'sluice-flume/**'
          - 'sluice-build-info/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          - '.github/workflows/deploy-flume.yaml'
          wicket:
          - 'sluice-wicket-wasi/**'
          - 'sluice-build-info/**'
          - 'sluice-oidc/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          - '.github/workflows/deploy-wicket.yaml'
          # its integration test runs the wicket and the flume: their change is its change too
          cf-api:
          - 'sluice-wicket-cf-api/**'
          - 'sluice-wicket-wasi/**'
          - 'sluice-flume/**'
          - 'sluice-build-info/**'
          - 'sluice-oidc/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          - '.github/workflows/deploy-cf-api.yaml'
  sluice-build-info:
    needs: changes
    if: needs.changes.outputs.build-info == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sluice-build-info
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  sluice-oidc:
    needs: changes
    if: needs.changes.outputs.oidc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sluice-oidc
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-oidc/target
        key: cargo-oidc-${{ runner.os }}-${{ hashFiles('sluice-oidc/Cargo.lock', 'sluice-oidc/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    - name: Test
      run: cargo test --all-features --locked
  sluice-flume:
    needs: changes
    if: needs.changes.outputs.flume == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sluice-flume
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-flume/target
        key: cargo-flume-${{ runner.os }}-${{ hashFiles('sluice-flume/Cargo.lock', 'sluice-flume/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  # The wicket builds on its pinned stable toolchain; its tests build the example guests through
  # the rustup cargo proxy in examples/, pinned to a nightly with wasm32-wasip3
  # (examples/rust-toolchain.toml), and run redis-server (Debian's has TLS) for the redis
  # store. The build without it (--no-default-features) is linted, its tests are not run.
  sluice-wicket-wasi:
    needs: changes
    if: needs.changes.outputs.wicket == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sluice-wicket-wasi
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc and redis-server
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler redis-server
    - uses: actions/cache@v4
      with:
        path: |
          ~/.rustup/toolchains/nightly-*
          ~/.rustup/toolchains/1.*
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-wasi/target
          sluice-wicket-wasi/examples/target
        key: cargo-wicket-${{ runner.os }}-${{ hashFiles('sluice-wicket-wasi/Cargo.lock', 'sluice-wicket-wasi/examples/Cargo.lock', 'sluice-wicket-wasi/rust-toolchain.toml', 'sluice-wicket-wasi/examples/rust-toolchain.toml') }}
    - name: Toolchains
      run: |
        rustup toolchain install
        (cd examples && rustup toolchain install)
    - name: Format
      run: |
        cargo fmt --check
        (cd examples && cargo fmt --check)
    - name: Clippy
      run: |
        cargo clippy --all-targets --locked -- -D warnings
        cargo clippy --locked --no-default-features -- -D warnings
        (cd examples && cargo clippy --all-targets --locked -- -D warnings)
    - name: Test
      run: cargo test --locked
  # The cf-api's integration test drives the OSS cf CLI (installed here) against the cf-api
  # and a wicket in local mode on a flume: the test builds the wicket (debug), its example
  # guests (the nightly toolchain examples/ pins) and the flume with cargo, so their targets
  # are cached too.
  sluice-wicket-cf-api:
    needs: changes
    if: needs.changes.outputs.cf-api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sluice-wicket-cf-api
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler
    - name: Install the cf CLI
      run: |
        curl -sSL https://github.com/cloudfoundry/cli/releases/download/v8.19.0/cf8-cli_8.19.0_linux_x86-64.tgz | sudo tar -xz -C /usr/local/bin cf8
        cf8 --version
    - uses: actions/cache@v4
      with:
        path: |
          ~/.rustup/toolchains/nightly-*
          ~/.rustup/toolchains/1.*
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-cf-api/target
          sluice-wicket-wasi/target
          sluice-wicket-wasi/examples/target
          sluice-flume/target
        key: cargo-cf-api-${{ runner.os }}-${{ hashFiles('sluice-wicket-cf-api/Cargo.lock', 'sluice-wicket-wasi/Cargo.lock', 'sluice-wicket-wasi/examples/Cargo.lock', 'sluice-flume/Cargo.lock', 'sluice-wicket-cf-api/rust-toolchain.toml', 'sluice-wicket-wasi/rust-toolchain.toml', 'sluice-wicket-wasi/examples/rust-toolchain.toml', 'sluice-flume/rust-toolchain.toml') }}
    - name: Toolchains
      run: |
        rustup toolchain install
        (cd ../sluice-wicket-wasi && rustup toolchain install)
        (cd ../sluice-wicket-wasi/examples && rustup toolchain install)
        (cd ../sluice-flume && rustup toolchain install)
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
