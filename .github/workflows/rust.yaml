name: Rust
# The Rust crates' own gates, apart from CI: a Java-only change runs none of them, and
# each crate's job runs only when its paths changed. CI still builds sluice-flume for the
# sluice-it tests. A run with the sluice-flume / sluice-wicket-runtime-wasi / sluice-wicket-cf-api /
# sluice-wicket-firecracker job passed deploys its image (deploy-flume.yaml /
# deploy-wicket-runtime-wasi.yaml / deploy-cf-api.yaml / deploy-firecracker.yaml).
on:
  push:
    branches:
    - main
    paths: &rust-paths
    - 'sluice-flume/**'
    - 'sluice-wicket-runtime-wasi/**'
    - 'sluice-wicket-cf-api/**'
    - 'sluice-wicket-firecracker/**'
    - 'sluice-build-info/**'
    - 'sluice-wicket-oidc/**'
    - 'sluice-wicket-tunnel/**'
    - 'sluice-proto/src/main/proto/**'
    - '.github/workflows/rust.yaml'
    - '.github/workflows/deploy-flume.yaml'
    - '.github/workflows/deploy-wicket-runtime-wasi.yaml'
    - '.github/workflows/deploy-cf-api.yaml'
    - '.github/workflows/deploy-firecracker.yaml'
  pull_request:
    branches:
    - main
    paths: *rust-paths
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build-info: ${{ steps.filter.outputs.build-info }}
      oidc: ${{ steps.filter.outputs.oidc }}
      tunnel: ${{ steps.filter.outputs.tunnel }}
      flume: ${{ steps.filter.outputs.flume }}
      wicket: ${{ steps.filter.outputs.wicket }}
      cf-api: ${{ steps.filter.outputs.cf-api }}
      firecracker: ${{ steps.filter.outputs.firecracker }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          build-info:
          - 'sluice-build-info/**'
          - '.github/workflows/rust.yaml'
          oidc:
          - 'sluice-wicket-oidc/**'
          - '.github/workflows/rust.yaml'
          tunnel:
          - 'sluice-wicket-tunnel/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          flume:
          - 'sluice-flume/**'
          - 'sluice-build-info/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          - '.github/workflows/deploy-flume.yaml'
          wicket:
          - 'sluice-wicket-runtime-wasi/**'
          - 'sluice-build-info/**'
          - 'sluice-wicket-oidc/**'
          - 'sluice-wicket-tunnel/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          - '.github/workflows/deploy-wicket-runtime-wasi.yaml'
          # its integration test runs the wicket and the flume: their change is its change too
          cf-api:
          - 'sluice-wicket-cf-api/**'
          - 'sluice-wicket-runtime-wasi/**'
          - 'sluice-flume/**'
          - 'sluice-build-info/**'
          - 'sluice-wicket-oidc/**'
          - 'sluice-wicket-tunnel/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          - '.github/workflows/deploy-cf-api.yaml'
          firecracker:
          - 'sluice-wicket-firecracker/**'
          - 'sluice-build-info/**'
          - 'sluice-wicket-tunnel/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          - '.github/workflows/deploy-firecracker.yaml'
  sluice-build-info:
    needs: changes
    if: needs.changes.outputs.build-info == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sluice-build-info
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  sluice-wicket-oidc:
    needs: changes
    if: needs.changes.outputs.oidc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sluice-wicket-oidc
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-oidc/target
        key: cargo-wicket-oidc-${{ runner.os }}-${{ hashFiles('sluice-wicket-oidc/Cargo.lock', 'sluice-wicket-oidc/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    - name: Test
      run: cargo test --all-features --locked
  sluice-wicket-tunnel:
    needs: changes
    if: needs.changes.outputs.tunnel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sluice-wicket-tunnel
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-tunnel/target
        key: cargo-wicket-tunnel-${{ runner.os }}-${{ hashFiles('sluice-wicket-tunnel/Cargo.lock', 'sluice-wicket-tunnel/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    - name: Test
      run: cargo test --all-features --locked
  sluice-flume:
    needs: changes
    if: needs.changes.outputs.flume == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sluice-flume
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-flume/target
        key: cargo-flume-${{ runner.os }}-${{ hashFiles('sluice-flume/Cargo.lock', 'sluice-flume/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  # The wicket builds on its pinned stable toolchain; its tests build the example guests through
  # the rustup cargo proxy in examples/, pinned to a nightly with wasm32-wasip3
  # (examples/rust-toolchain.toml), and run redis-server (Debian's has TLS) for the redis
  # store. The build without it (--no-default-features) is linted, its tests are not run.
  sluice-wicket-runtime-wasi:
    needs: changes
    if: needs.changes.outputs.wicket == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sluice-wicket-runtime-wasi
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc and redis-server
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler redis-server
    - uses: actions/cache@v4
      with:
        path: |
          ~/.rustup/toolchains/nightly-*
          ~/.rustup/toolchains/1.*
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-runtime-wasi/target
          sluice-wicket-runtime-wasi/examples/target
        key: cargo-wicket-runtime-wasi-${{ runner.os }}-${{ hashFiles('sluice-wicket-runtime-wasi/Cargo.lock', 'sluice-wicket-runtime-wasi/examples/Cargo.lock', 'sluice-wicket-runtime-wasi/rust-toolchain.toml', 'sluice-wicket-runtime-wasi/examples/rust-toolchain.toml') }}
    - name: Toolchains
      run: |
        rustup toolchain install
        (cd examples && rustup toolchain install)
    - name: Format
      run: |
        cargo fmt --check
        (cd examples && cargo fmt --check)
    - name: Clippy
      run: |
        cargo clippy --all-targets --locked -- -D warnings
        cargo clippy --locked --no-default-features -- -D warnings
        (cd examples && cargo clippy --all-targets --locked -- -D warnings)
    - name: Test
      run: cargo test --locked
  # The cf-api's integration test drives the OSS cf CLI (installed here) against the cf-api
  # and a wicket in local mode on a flume: the test builds the wicket (debug), its example
  # guests (the nightly toolchain examples/ pins) and the flume with cargo, so their targets
  # are cached too.
  sluice-wicket-cf-api:
    needs: changes
    if: needs.changes.outputs.cf-api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sluice-wicket-cf-api
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler
    - name: Install the cf CLI
      run: |
        curl -sSL https://github.com/cloudfoundry/cli/releases/download/v8.19.0/cf8-cli_8.19.0_linux_x86-64.tgz | sudo tar -xz -C /usr/local/bin cf8
        cf8 --version
    - uses: actions/cache@v4
      with:
        path: |
          ~/.rustup/toolchains/nightly-*
          ~/.rustup/toolchains/1.*
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-cf-api/target
          sluice-wicket-runtime-wasi/target
          sluice-wicket-runtime-wasi/examples/target
          sluice-flume/target
        key: cargo-cf-api-${{ runner.os }}-${{ hashFiles('sluice-wicket-cf-api/Cargo.lock', 'sluice-wicket-runtime-wasi/Cargo.lock', 'sluice-wicket-runtime-wasi/examples/Cargo.lock', 'sluice-flume/Cargo.lock', 'sluice-wicket-cf-api/rust-toolchain.toml', 'sluice-wicket-runtime-wasi/rust-toolchain.toml', 'sluice-wicket-runtime-wasi/examples/rust-toolchain.toml', 'sluice-flume/rust-toolchain.toml') }}
    - name: Toolchains
      run: |
        rustup toolchain install
        (cd ../sluice-wicket-runtime-wasi && rustup toolchain install)
        (cd ../sluice-wicket-runtime-wasi/examples && rustup toolchain install)
        (cd ../sluice-flume && rustup toolchain install)
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  # The wicket's VM test boots Firecracker microVMs where the runner exposes /dev/kvm (made
  # usable for the runner's user by a udev rule) and is skipped where it does not; Firecracker
  # and the guest kernel are pinned here, checksums verified. Its guest (guest/, the VMs'
  # /init on musl) is its own workspace, linted and tested apart.
  sluice-wicket-firecracker:
    needs: changes
    if: needs.changes.outputs.firecracker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sluice-wicket-firecracker
    env:
      SLUICE_FIRECRACKER: /usr/local/bin/firecracker
      SLUICE_FIRECRACKER_KERNEL: /opt/firecracker/vmlinux
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler
    - name: KVM
      run: |
        if [ -e /dev/kvm ]; then
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        fi
        ls -l /dev/kvm || echo "no /dev/kvm: the VM test is skipped"
    - name: Firecracker and a guest kernel
      working-directory: ${{ runner.temp }}
      run: |
        FC=v1.17.0 ARCH=x86_64
        curl -fsSLO https://github.com/firecracker-microvm/firecracker/releases/download/$FC/firecracker-$FC-$ARCH.tgz
        echo "06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558  firecracker-$FC-$ARCH.tgz" | sha256sum -c
        tar xzf firecracker-$FC-$ARCH.tgz
        sudo install -D release-$FC-$ARCH/firecracker-$FC-$ARCH "$SLUICE_FIRECRACKER"
        curl -fsSL -o vmlinux https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/20261028-84df49062576-0/x86_64/vmlinux-6.18.56
        echo "a00c1f68304e83ae4e0b5afe88972ad23fda52ed1a40335611aa18faa95d1b10  vmlinux" | sha256sum -c
        sudo install -D -m 0644 vmlinux "$SLUICE_FIRECRACKER_KERNEL"
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-firecracker/target
          sluice-wicket-firecracker/guest/target
        key: cargo-firecracker-${{ runner.os }}-${{ hashFiles('sluice-wicket-firecracker/Cargo.lock', 'sluice-wicket-firecracker/guest/Cargo.lock', 'sluice-wicket-firecracker/rust-toolchain.toml', 'sluice-wicket-firecracker/guest/rust-toolchain.toml') }}
    # the toolchains rust-toolchain.toml pins, the guest's with the musl target
    - name: Toolchains
      run: |
        rustup toolchain install
        (cd guest && rustup toolchain install)
    - name: Format
      run: |
        cargo fmt --check
        (cd guest && cargo fmt --check)
    - name: Clippy
      run: |
        cargo clippy --all-targets --locked -- -D warnings
        (cd guest && cargo clippy --all-targets --locked -- -D warnings)
    - name: Test
      run: |
        cargo test --locked
        (cd guest && cargo test --locked)
    # the VM test again, the wicket run as its image (Dockerfile) as the README runs it
    - name: Test the image
      run: |
        if [ ! -e /dev/kvm ]; then echo "no /dev/kvm: skipped"; exit 0; fi
        docker build -f Dockerfile --build-arg GIT_COMMIT=${GITHUB_SHA} -t sluice-wicket-firecracker:ci ..
        SLUICE_FIRECRACKER_IMAGE=sluice-wicket-firecracker:ci cargo test --locked --test vm
