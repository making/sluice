name: Rust
# The Rust crates' own gates, apart from CI: a Java-only change runs none of them, and
# each crate's job runs only when its paths changed since the last run that passed. CI still
# builds sluice-flume for the sluice-it tests. A run with the sluice-flume /
# sluice-wicket-runtime-wasi / sluice-wicket-cf-api / sluice-wicket-runtime-firecracker job
# passed deploys its image (deploy-flume.yaml / deploy-wicket-runtime-wasi.yaml /
# deploy-cf-api.yaml / deploy-wicket-runtime-firecracker.yaml).
on:
  push:
    branches:
    - main
    paths: &rust-paths
    - 'sluice-client-wasm/**'
    - 'sluice-flume/**'
    - 'sluice-wicket-runtime-wasi/**'
    - 'sluice-wicket-site/**'
    - 'sluice-wicket-cf-api/**'
    - 'sluice-wicket-runtime-firecracker/**'
    - 'sluice-build-info/**'
    - 'sluice-wicket-oidc/**'
    - 'sluice-wicket-server/**'
    - 'sluice-wicket-console/**'
    - 'sluice-wicket-registry/**'
    - 'sluice-wicket-tunnel/**'
    - 'sluice-wicket-keyvalue-gemfire/**'
    - 'sluice-proto/src/main/proto/**'
    - '.github/workflows/rust.yaml'
    - '.github/workflows/deploy-flume.yaml'
    - '.github/workflows/deploy-wicket-runtime-wasi.yaml'
    - '.github/workflows/deploy-cf-api.yaml'
    - '.github/workflows/deploy-wicket-runtime-firecracker.yaml'
  pull_request:
    branches:
    - main
    paths: *rust-paths
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      client-wasm: ${{ steps.filter.outputs.client-wasm }}
      build-info: ${{ steps.filter.outputs.build-info }}
      oidc: ${{ steps.filter.outputs.oidc }}
      server: ${{ steps.filter.outputs.server }}
      console: ${{ steps.filter.outputs.console }}
      registry: ${{ steps.filter.outputs.registry }}
      tunnel: ${{ steps.filter.outputs.tunnel }}
      keyvalue-gemfire: ${{ steps.filter.outputs.keyvalue-gemfire }}
      flume: ${{ steps.filter.outputs.flume }}
      wicket: ${{ steps.filter.outputs.wicket }}
      cf-api: ${{ steps.filter.outputs.cf-api }}
      firecracker: ${{ steps.filter.outputs.firecracker }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # A push is compared with the commit of the last run that passed, not with the commit before
    # it: a crate changed by a push whose run failed runs again (and its image deploys) with the
    # next push, whatever that one changes. None passed yet: the commit before the push.
    - name: The last passing run's commit
      id: base
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PASSED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/rust.yaml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
        echo "last passing run's commit: ${PASSED:-none}" | tee -a "${GITHUB_STEP_SUMMARY}"
        echo "sha=${PASSED}" >> "${GITHUB_OUTPUT}"
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        base: ${{ steps.base.outputs.sha || github.event.before }}
        filters: |
          client-wasm:
          - 'sluice-client-wasm/**'
          - '.github/workflows/rust.yaml'
          build-info:
          - 'sluice-build-info/**'
          - '.github/workflows/rust.yaml'
          oidc:
          - 'sluice-wicket-oidc/**'
          - '.github/workflows/rust.yaml'
          server:
          - 'sluice-wicket-server/**'
          - '.github/workflows/rust.yaml'
          console:
          - 'sluice-wicket-console/**'
          - 'sluice-wicket-server/**'
          - 'sluice-wicket-oidc/**'
          - '.github/workflows/rust.yaml'
          registry:
          - 'sluice-wicket-registry/**'
          - 'sluice-wicket-oidc/**'
          - '.github/workflows/rust.yaml'
          tunnel:
          - 'sluice-wicket-tunnel/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          keyvalue-gemfire:
          - 'sluice-wicket-keyvalue-gemfire/**'
          - '.github/workflows/rust.yaml'
          flume:
          - 'sluice-flume/**'
          - 'sluice-build-info/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          - '.github/workflows/deploy-flume.yaml'
          wicket:
          - 'sluice-wicket-runtime-wasi/**'
          - 'sluice-wicket-site/**'
          - 'sluice-build-info/**'
          - 'sluice-wicket-oidc/**'
          - 'sluice-wicket-server/**'
          - 'sluice-wicket-console/**'
          - 'sluice-wicket-tunnel/**'
          - 'sluice-wicket-keyvalue-gemfire/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          - '.github/workflows/deploy-wicket-runtime-wasi.yaml'
          # its integration test runs the wicket and the flume: their change is its change too
          cf-api:
          - 'sluice-wicket-cf-api/**'
          - 'sluice-wicket-runtime-wasi/**'
          - 'sluice-wicket-site/**'
          - 'sluice-flume/**'
          - 'sluice-build-info/**'
          - 'sluice-wicket-oidc/**'
          - 'sluice-wicket-server/**'
          - 'sluice-wicket-console/**'
          - 'sluice-wicket-registry/**'
          - 'sluice-wicket-tunnel/**'
          - 'sluice-wicket-keyvalue-gemfire/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          - '.github/workflows/deploy-cf-api.yaml'
          # its job runs the cf-api's test against the wicket, on a flume
          firecracker:
          - 'sluice-wicket-runtime-firecracker/**'
          - 'sluice-wicket-cf-api/**'
          - 'sluice-wicket-site/**'
          - 'sluice-flume/**'
          - 'sluice-build-info/**'
          - 'sluice-wicket-oidc/**'
          - 'sluice-wicket-server/**'
          - 'sluice-wicket-console/**'
          - 'sluice-wicket-registry/**'
          - 'sluice-wicket-tunnel/**'
          - 'sluice-proto/src/main/proto/**'
          - '.github/workflows/rust.yaml'
          - '.github/workflows/deploy-wicket-runtime-firecracker.yaml'
  sluice-build-info:
    needs: changes
    if: needs.changes.outputs.build-info == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sluice-build-info
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  sluice-wicket-oidc:
    needs: changes
    if: needs.changes.outputs.oidc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sluice-wicket-oidc
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-oidc/target
        key: cargo-wicket-oidc-${{ runner.os }}-${{ hashFiles('sluice-wicket-oidc/Cargo.lock', 'sluice-wicket-oidc/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    - name: Test
      run: cargo test --all-features --locked
  sluice-wicket-console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sluice-wicket-console
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-console/target
        key: cargo-wicket-console-${{ runner.os }}-${{ hashFiles('sluice-wicket-console/Cargo.lock', 'sluice-wicket-console/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  sluice-wicket-server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sluice-wicket-server
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-server/target
        key: cargo-wicket-server-${{ runner.os }}-${{ hashFiles('sluice-wicket-server/Cargo.lock', 'sluice-wicket-server/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  sluice-wicket-registry:
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sluice-wicket-registry
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-registry/target
        key: cargo-wicket-registry-${{ runner.os }}-${{ hashFiles('sluice-wicket-registry/Cargo.lock', 'sluice-wicket-registry/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  sluice-wicket-tunnel:
    needs: changes
    if: needs.changes.outputs.tunnel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sluice-wicket-tunnel
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-tunnel/target
        key: cargo-wicket-tunnel-${{ runner.os }}-${{ hashFiles('sluice-wicket-tunnel/Cargo.lock', 'sluice-wicket-tunnel/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    - name: Test
      run: cargo test --all-features --locked
  # its tests run the mock cluster (feature mock) in process
  sluice-wicket-keyvalue-gemfire:
    needs: changes
    if: needs.changes.outputs.keyvalue-gemfire == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sluice-wicket-keyvalue-gemfire
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-keyvalue-gemfire/target
        key: cargo-wicket-keyvalue-gemfire-${{ runner.os }}-${{ hashFiles('sluice-wicket-keyvalue-gemfire/Cargo.lock', 'sluice-wicket-keyvalue-gemfire/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    - name: Test
      run: cargo test --all-features --locked
  # sluice-client's plugins run on it, a library the JVM loads: its gates on each platform
  # the client may carry it for (CI's Java build tests it with the JVM on x86_64 and aarch64).
  sluice-client-wasm:
    needs: changes
    if: needs.changes.outputs.client-wasm == 'true'
    name: sluice-client-wasm (${{ matrix.runs_on }})
    strategy:
      fail-fast: false
      matrix:
        runs_on:
        - ubuntu-latest
        - ubuntu-24.04-arm
        - macos-latest
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sluice-client-wasm
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-client-wasm/target
        key: cargo-client-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sluice-client-wasm/Cargo.lock', 'sluice-client-wasm/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  sluice-flume:
    needs: changes
    if: needs.changes.outputs.flume == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sluice-flume
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler
    # the toolchain rust-toolchain.toml pins
    - name: Toolchain
      run: rustup toolchain install
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-flume/target
        key: cargo-flume-${{ runner.os }}-${{ hashFiles('sluice-flume/Cargo.lock', 'sluice-flume/rust-toolchain.toml') }}
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  # The wicket builds on its pinned stable toolchain; its tests build the example guests and
  # sluice-wicket-site through the rustup cargo proxy in examples/ and there, each pinned to a
  # nightly with wasm32-wasip3 (their rust-toolchain.toml), and run redis-server (Debian's has TLS) for the redis
  # store, the gemfire store's mock cluster in process. The build without them
  # (--no-default-features) is linted, its tests are not run.
  sluice-wicket-runtime-wasi:
    needs: changes
    if: needs.changes.outputs.wicket == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sluice-wicket-runtime-wasi
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc and redis-server
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler redis-server
    - uses: actions/cache@v4
      with:
        path: |
          ~/.rustup/toolchains/nightly-*
          ~/.rustup/toolchains/1.*
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-runtime-wasi/target
          sluice-wicket-runtime-wasi/examples/target
          sluice-wicket-site/target
        key: cargo-wicket-runtime-wasi-${{ runner.os }}-${{ hashFiles('sluice-wicket-runtime-wasi/Cargo.lock', 'sluice-wicket-runtime-wasi/examples/Cargo.lock', 'sluice-wicket-site/Cargo.lock', 'sluice-wicket-runtime-wasi/rust-toolchain.toml', 'sluice-wicket-runtime-wasi/examples/rust-toolchain.toml', 'sluice-wicket-site/rust-toolchain.toml') }}
    - name: Toolchains
      run: |
        rustup toolchain install
        (cd examples && rustup toolchain install)
        (cd ../sluice-wicket-site && rustup toolchain install)
    - name: Format
      run: |
        cargo fmt --check
        (cd examples && cargo fmt --check)
        (cd ../sluice-wicket-site && cargo fmt --check)
    - name: Clippy
      run: |
        cargo clippy --all-targets --locked -- -D warnings
        cargo clippy --locked --no-default-features -- -D warnings
        (cd examples && cargo clippy --all-targets --locked -- -D warnings)
        (cd ../sluice-wicket-site && cargo clippy --all-targets --locked -- -D warnings)
    - name: Test
      run: cargo test --locked
  # The cf-api's integration test drives the OSS cf CLI (installed here) against the cf-api
  # and a wicket in local mode on a flume: the test builds the wicket (debug), its example
  # guests (the nightly toolchain examples/ pins), sluice-wicket-site (the cf-api's build
  # embeds it; the nightly it pins) and the flume with cargo, so their targets are cached too.
  # Its wickets share a redis-server's keyvalue store.
  sluice-wicket-cf-api:
    needs: changes
    if: needs.changes.outputs.cf-api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sluice-wicket-cf-api
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc and redis-server
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler redis-server
    - name: Install the cf CLI
      run: |
        curl -sSL https://github.com/cloudfoundry/cli/releases/download/v8.19.0/cf8-cli_8.19.0_linux_x86-64.tgz | sudo tar -xz -C /usr/local/bin cf8
        cf8 --version
    - uses: actions/cache@v4
      with:
        path: |
          ~/.rustup/toolchains/nightly-*
          ~/.rustup/toolchains/1.*
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-cf-api/target
          sluice-wicket-runtime-wasi/target
          sluice-wicket-runtime-wasi/examples/target
          sluice-wicket-site/target
          sluice-flume/target
        key: cargo-cf-api-${{ runner.os }}-${{ hashFiles('sluice-wicket-cf-api/Cargo.lock', 'sluice-wicket-runtime-wasi/Cargo.lock', 'sluice-wicket-runtime-wasi/examples/Cargo.lock', 'sluice-wicket-site/Cargo.lock', 'sluice-flume/Cargo.lock', 'sluice-wicket-cf-api/rust-toolchain.toml', 'sluice-wicket-runtime-wasi/rust-toolchain.toml', 'sluice-wicket-runtime-wasi/examples/rust-toolchain.toml', 'sluice-wicket-site/rust-toolchain.toml', 'sluice-flume/rust-toolchain.toml') }}
    - name: Toolchains
      run: |
        rustup toolchain install
        (cd ../sluice-wicket-runtime-wasi && rustup toolchain install)
        (cd ../sluice-wicket-runtime-wasi/examples && rustup toolchain install)
        (cd ../sluice-wicket-site && rustup toolchain install)
        (cd ../sluice-flume && rustup toolchain install)
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Test
      run: cargo test --locked
  # The wicket's VM test boots Firecracker microVMs where the runner exposes /dev/kvm (made
  # usable for the runner's user by a udev rule) and is skipped where it does not; Firecracker
  # and the guest kernel are pinned here, checksums verified. Its guest (guest/, the VMs'
  # /init on musl) is its own workspace, linted and tested apart. Once per arch: a runner
  # without /dev/kvm still builds the code, the guests and the image, and runs the tests
  # without VMs.
  sluice-wicket-runtime-firecracker:
    needs: changes
    if: needs.changes.outputs.firecracker == 'true'
    name: sluice-wicket-runtime-firecracker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runs_on: ubuntu-latest
          firecracker_sha256: 06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558
          kernel_sha256: a00c1f68304e83ae4e0b5afe88972ad23fda52ed1a40335611aa18faa95d1b10
        - arch: aarch64
          runs_on: ubuntu-24.04-arm
          firecracker_sha256: e351ebe4f7a16b5873bbd51005d2e6767103cff4d5ebc829df2d3f95a93e2256
          kernel_sha256: ba2081f71b3405e7f7be606b849b5341d2272dcb79999cb67f8061e711d0883f
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sluice-wicket-runtime-firecracker
    env:
      SLUICE_WICKET_RUNTIME_FIRECRACKER_FIRECRACKER: /usr/local/bin/firecracker
      SLUICE_WICKET_RUNTIME_FIRECRACKER_KERNEL: /opt/firecracker/vmlinux
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends protobuf-compiler
    - name: KVM
      run: |
        if [ -e /dev/kvm ]; then
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        fi
        ls -l /dev/kvm || echo "no /dev/kvm: the VM test is skipped"
    - name: Firecracker and a guest kernel
      working-directory: ${{ runner.temp }}
      env:
        ARCH: ${{ matrix.arch }}
        FIRECRACKER_SHA256: ${{ matrix.firecracker_sha256 }}
        KERNEL_SHA256: ${{ matrix.kernel_sha256 }}
      run: |
        FC=v1.17.0
        curl -fsSLO https://github.com/firecracker-microvm/firecracker/releases/download/$FC/firecracker-$FC-$ARCH.tgz
        echo "$FIRECRACKER_SHA256  firecracker-$FC-$ARCH.tgz" | sha256sum -c
        tar xzf firecracker-$FC-$ARCH.tgz
        sudo install -D release-$FC-$ARCH/firecracker-$FC-$ARCH "$SLUICE_WICKET_RUNTIME_FIRECRACKER_FIRECRACKER"
        curl -fsSL -o vmlinux https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/20261028-84df49062576-0/$ARCH/vmlinux-6.18.56
        echo "$KERNEL_SHA256  vmlinux" | sha256sum -c
        sudo install -D -m 0644 vmlinux "$SLUICE_WICKET_RUNTIME_FIRECRACKER_KERNEL"
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          sluice-wicket-runtime-firecracker/target
          sluice-wicket-runtime-firecracker/guest/target
        key: cargo-wicket-runtime-firecracker-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('sluice-wicket-runtime-firecracker/Cargo.lock', 'sluice-wicket-runtime-firecracker/guest/Cargo.lock', 'sluice-wicket-runtime-firecracker/rust-toolchain.toml', 'sluice-wicket-runtime-firecracker/guest/rust-toolchain.toml') }}
    # the toolchains rust-toolchain.toml pins, the guest's with both arches' musl targets
    - name: Toolchains
      run: |
        rustup toolchain install
        (cd guest && rustup toolchain install)
    - name: Format
      run: |
        cargo fmt --check
        (cd guest && cargo fmt --check)
    - name: Clippy
      run: |
        cargo clippy --all-targets --locked -- -D warnings
        (cd guest && cargo clippy --all-targets --locked -- -D warnings)
    - name: Test
      run: |
        cargo test --locked
        (cd guest && cargo test --locked)
    # the OSS cf CLI deploying to the wicket, its image made on the wicket (x86_64 alone: the
    # aarch64 runner has no /dev/kvm): skipped by the cf-api's job, which has no Firecracker
    - name: Test the cf-api on it
      if: matrix.arch == 'x86_64'
      run: |
        if [ ! -e /dev/kvm ]; then echo "no /dev/kvm: skipped"; exit 0; fi
        curl -sSL https://github.com/cloudfoundry/cli/releases/download/v8.19.0/cf8-cli_8.19.0_linux_x86-64.tgz | sudo tar -xz -C /usr/local/bin cf8
        (cd ../sluice-flume && rustup toolchain install)
        # the cf-api's build embeds sluice-wicket-site, built on the toolchain it pins
        (cd ../sluice-wicket-site && rustup toolchain install)
        cd ../sluice-wicket-cf-api
        rustup toolchain install
        cargo test --locked --test cli the_cf_cli_deploys_to_a_firecracker_wicket
    # the guest of the runner's arch and, cross built, of the other
    - name: Guests
      run: |
        SLUICE_GUEST_ARCH=x86_64 scripts/guest.sh
        SLUICE_GUEST_ARCH=aarch64 scripts/guest.sh
    # the VM test again in jail mode: the wicket started as root (sudo -n)
    - name: Test the jail
      run: |
        if [ ! -e /dev/kvm ]; then echo "no /dev/kvm: skipped"; exit 0; fi
        SLUICE_WICKET_RUNTIME_FIRECRACKER_JAIL=1 cargo test --locked --test vm
    # the image of the runner's arch (Dockerfile), then the VM test again, the wicket run as
    # the image as the README runs it, then jailed
    - name: Test the image
      run: |
        docker build -f Dockerfile --build-arg GIT_COMMIT=${GITHUB_SHA} -t sluice-wicket-runtime-firecracker:ci ..
        if [ ! -e /dev/kvm ]; then echo "no /dev/kvm: the VM test skipped"; exit 0; fi
        SLUICE_WICKET_RUNTIME_FIRECRACKER_IMAGE=sluice-wicket-runtime-firecracker:ci cargo test --locked --test vm
        SLUICE_WICKET_RUNTIME_FIRECRACKER_IMAGE=sluice-wicket-runtime-firecracker:ci SLUICE_WICKET_RUNTIME_FIRECRACKER_JAIL=1 \
          cargo test --locked --test vm
